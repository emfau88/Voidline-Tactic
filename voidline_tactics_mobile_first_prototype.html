<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Voidline Tactics — Mobile First Prototype</title>
<style>
  :root{
    --bg:#05070b;
    --panel:rgba(8,11,17,.96);
    --panel2:rgba(12,16,23,.96);
    --gold:#b69658;
    --gold2:#6d5732;
    --text:#eee7d9;
    --muted:#96a0ad;
    --blue:#5ab6ff;
    --cyan:#54d3dc;
    --red:#ef5d68;
    --orange:#ff9d4c;
    --purple:#d46dff;
    --green:#70dc92;
    --line:rgba(182,150,88,.52);
    --safeTop:env(safe-area-inset-top,0px);
    --safeBottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030407;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
  button{font:inherit;color:inherit}
  #app{position:relative;width:100vw;height:100dvh;min-height:100svh;overflow:hidden;background:#030407}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none}
  .glass{background:linear-gradient(180deg,rgba(9,12,18,.97),rgba(6,9,14,.94));border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.34)}
  #topbar{
    pointer-events:auto;position:absolute;left:8px;right:8px;top:calc(8px + var(--safeTop));height:54px;
    border-radius:8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;z-index:8
  }
  .brand{min-width:0}
  .brand b{display:block;font-family:Georgia,serif;letter-spacing:.06em;font-size:12px;color:#d7c69e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{font-size:9px;color:#8793a3}
  .turn{text-align:center;font-family:Georgia,serif;letter-spacing:.08em;font-size:15px}
  .turn small{display:block;color:#9aa6b4;font:9px Inter,system-ui,sans-serif;letter-spacing:.02em;margin-top:2px}
  .objective{text-align:right;min-width:0}
  .objective b{display:block;color:#d7c69e;font-size:9px;letter-spacing:.08em}
  .objective span{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #help{
    pointer-events:auto;position:absolute;right:10px;top:calc(70px + var(--safeTop));z-index:9;width:36px;height:36px;border-radius:50%;
    border:1px solid var(--line);background:rgba(8,11,17,.9);display:grid;place-items:center;color:#d8c698;font-weight:700
  }
  #toast{
    position:absolute;left:50%;top:calc(74px + var(--safeTop));transform:translateX(-50%);
    max-width:86vw;background:rgba(5,8,13,.92);border:1px solid rgba(91,183,255,.34);
    padding:7px 10px;border-radius:8px;font-size:11px;color:#dce8f4;z-index:7;opacity:0;transition:.18s;
    text-align:center;pointer-events:none
  }
  #toast.show{opacity:1}
  #bottom{
    pointer-events:auto;position:absolute;left:0;right:0;bottom:0;z-index:10;
    padding:8px 8px calc(8px + var(--safeBottom));
    background:linear-gradient(180deg,rgba(5,7,10,.0),rgba(4,6,10,.92) 12%,rgba(4,6,10,.985) 34%);
  }
  #infoCard{
    margin:0 auto 7px;max-width:720px;border-radius:10px;padding:9px 10px;
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start
  }
  .shipName{font-family:Georgia,serif;color:#dbcaa2;font-size:13px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shipClass{font-size:9px;color:#8391a1;margin-top:1px}
  .bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}
  .stat label{display:flex;justify-content:space-between;gap:4px;font-size:8px;color:#9eabb8;margin-bottom:3px}
  .bar{height:5px;background:#181e27;border:1px solid #242d38;overflow:hidden}
  .fill{height:100%}
  .hull{background:#d3665d}.shield{background:#4fa6e8}.energy{background:#53c8d0}
  .miniStats{display:flex;gap:8px;margin-top:6px;font-size:9px;color:#aab3bf;flex-wrap:wrap}
  .miniStats b{color:#eee7d9}
  #statusPill{font-size:9px;border:1px solid rgba(91,183,255,.34);padding:4px 6px;border-radius:999px;color:#8ed0ff;white-space:nowrap}
  #actionsWrap{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr 50px;gap:6px}
  #actions{
    display:grid;grid-template-columns:repeat(6,minmax(62px,1fr));gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px
  }
  #actions::-webkit-scrollbar{display:none}
  .act{
    min-height:58px;border-radius:8px;border:1px solid rgba(182,150,88,.42);background:linear-gradient(180deg,#10151e,#090d14);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.018)
  }
  .act .ico{font-size:17px;line-height:1}
  .act b{font-size:9px;letter-spacing:.04em}
  .act small{font-size:8px;color:#8995a3}
  .act.active{border-color:#62b7ff;box-shadow:0 0 0 1px rgba(98,183,255,.25),0 0 18px rgba(55,145,225,.16);background:linear-gradient(180deg,#14243a,#0b111b)}
  .act:disabled{opacity:.38}
  #endTurn{
    border-radius:8px;border:1px solid rgba(182,150,88,.55);background:linear-gradient(180deg,#1a1610,#0c0c0d);
    display:grid;place-items:center;font-family:Georgia,serif;color:#e8d6a7;font-size:18px
  }
  #confirmBar{
    max-width:820px;margin:6px auto 0;display:none;grid-template-columns:1fr 1fr;gap:6px
  }
  #confirmBar.show{display:grid}
  #confirmBar button{
    min-height:42px;border-radius:8px;border:1px solid var(--line);background:#111722;font-size:11px;font-weight:700
  }
  #confirmMove{border-color:rgba(112,220,146,.5)!important;color:#8fe6aa!important}
  #cancelMove{color:#d9b4b4!important}
  #overlay{
    pointer-events:auto;position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(1,3,7,.78);backdrop-filter:blur(4px)
  }
  #overlay.show{display:flex}
  .modal{width:min(94vw,720px);max-height:88dvh;overflow:auto;border-radius:12px;padding:14px}
  .modal h2{font-family:Georgia,serif;color:#dac79b;letter-spacing:.08em;margin:0 0 4px;font-size:20px}
  .modal p{color:#aab4c1;font-size:11px;line-height:1.45}
  .upgrades{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
  .upgrade{border:1px solid rgba(182,150,88,.42);border-radius:9px;padding:10px;background:#0d1118}
  .upgrade b{font-size:12px;color:#eee7d9}
  .upgrade small{display:block;color:#98a3b1;margin-top:4px;font-size:10px;line-height:1.35}
  .upgrade button,.primary{
    width:100%;margin-top:8px;min-height:42px;border:1px solid rgba(182,150,88,.6);border-radius:8px;background:#17130d;color:#e9d8ae;font-weight:700
  }
  .resultStats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
  .resultStats div{background:#0d1118;border:1px solid #242d38;border-radius:8px;padding:9px}
  .resultStats span{display:block;color:#8996a6;font-size:9px}
  .resultStats b{font-size:16px;color:#eee7d9}
  #desktopSide{display:none}
  @media (min-width:900px) and (orientation:landscape){
    #bottom{padding-left:300px;padding-right:300px}
    #infoCard{display:none}
    #desktopSide{display:block}
    .side{
      position:absolute;top:78px;width:260px;bottom:112px;z-index:9;border-radius:10px;padding:12px;pointer-events:none
    }
    #leftSide{left:12px}
    #rightSide{right:12px}
    .side h3{font-family:Georgia,serif;color:#dac79b;margin:0 0 10px;font-size:14px}
    .side .row{display:flex;justify-content:space-between;font-size:10px;color:#a8b2bf;padding:5px 0;border-bottom:1px solid #1e2630}
    .side .row b{color:#eee7d9}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="topbar" class="glass">
      <div class="brand">
        <div>
          <b>VOIDLINE TACTICS</b>
          <small>SHROUDED REACH</small>
        </div>
      </div>
      <div class="turn">TURN <span id="turnNo">1</span><small id="phaseText">PLAYER PHASE</small></div>
      <div class="objective"><b>OBJECTIVE</b><span id="objectiveText">Destroy all enemy ships</span></div>
    </div>
    <button id="help">?</button>
    <div id="toast"></div>

    <div id="desktopSide">
      <div id="leftSide" class="side glass"></div>
      <div id="rightSide" class="side glass"></div>
    </div>

    <div id="bottom">
      <div id="infoCard" class="glass">
        <div>
          <div class="shipName" id="shipName">Sovereign's Fury</div>
          <div class="shipClass" id="shipClass">CRUISER</div>
          <div class="bars">
            <div class="stat"><label><span>HULL</span><span id="hullTxt"></span></label><div class="bar"><div id="hullBar" class="fill hull"></div></div></div>
            <div class="stat"><label><span>SHIELD</span><span id="shieldTxt"></span></label><div class="bar"><div id="shieldBar" class="fill shield"></div></div></div>
            <div class="stat"><label><span>ENERGY</span><span id="energyTxt"></span></label><div class="bar"><div id="energyBar" class="fill energy"></div></div></div>
          </div>
          <div class="miniStats"><span>AP <b id="apTxt"></b></span><span>CREW <b id="crewTxt"></b></span><span>FACING <b id="facingTxt"></b></span></div>
        </div>
        <div id="statusPill">READY</div>
      </div>

      <div id="actionsWrap">
        <div id="actions">
          <button class="act" data-action="move"><span class="ico">➤</span><b>MOVE</b><small>1 AP</small></button>
          <button class="act" data-action="rotate"><span class="ico">⟳</span><b>ROTATE</b><small>1 AP</small></button>
          <button class="act" data-action="broadside"><span class="ico">⇉</span><b>BROADSIDE</b><small>2 AP</small></button>
          <button class="act" data-action="lance"><span class="ico">✦</span><b>LANCE</b><small>2 AP</small></button>
          <button class="act" data-action="torpedo"><span class="ico">➜</span><b>TORPEDO</b><small>2 AP</small></button>
          <button class="act" data-action="shield"><span class="ico">⬡</span><b>SHIELD</b><small>1 AP</small></button>
        </div>
        <button id="endTurn">⌛</button>
      </div>

      <div id="confirmBar">
        <button id="cancelMove">CANCEL</button>
        <button id="confirmMove">CONFIRM</button>
      </div>
    </div>

    <div id="overlay">
      <div class="modal glass" id="modalContent"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const ui = {
    turnNo: document.getElementById('turnNo'),
    phaseText: document.getElementById('phaseText'),
    toast: document.getElementById('toast'),
    shipName: document.getElementById('shipName'),
    shipClass: document.getElementById('shipClass'),
    hullTxt: document.getElementById('hullTxt'),
    shieldTxt: document.getElementById('shieldTxt'),
    energyTxt: document.getElementById('energyTxt'),
    apTxt: document.getElementById('apTxt'),
    crewTxt: document.getElementById('crewTxt'),
    facingTxt: document.getElementById('facingTxt'),
    hullBar: document.getElementById('hullBar'),
    shieldBar: document.getElementById('shieldBar'),
    energyBar: document.getElementById('energyBar'),
    statusPill: document.getElementById('statusPill'),
    confirmBar: document.getElementById('confirmBar'),
    confirmMove: document.getElementById('confirmMove'),
    cancelMove: document.getElementById('cancelMove'),
    leftSide: document.getElementById('leftSide'),
    rightSide: document.getElementById('rightSide'),
    overlay: document.getElementById('overlay'),
    modal: document.getElementById('modalContent')
  };

  let W=390,H=844, topSafe=70, bottomSafe=225, battlefield={x:8,y:70,w:374,h:540};
  function resize(){
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    topSafe = 72 + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safeTop')) || 72;
    bottomSafe = W<900 || H>W ? 220 : 108;
    battlefield = {x:8,y:topSafe,w:W-16,h:Math.max(180,H-topSafe-bottomSafe)};
  }
  addEventListener('resize',resize); resize();

  const state = {
    turn:1, phase:'player', selected:null, target:null, mode:null,
    pending:null, anims:[], particles:[], rewards:{credits:0,salvage:0},
    upgrades:{lance:0,shield:0,reactor:0},
    gameOver:false
  };

  const ships = [];
  function mkShip(o){
    return Object.assign({
      team:'player', class:'CRUISER', name:'Ship',
      hull:120,maxHull:120,shield:80,maxShield:80,energy:70,maxEnergy:70,ap:3,maxAp:3,crew:300,maxCrew:300,
      x:.5,y:.5,angle:-Math.PI/2,r:24, move:130,
      broadsideRange:220,lanceRange:300,torpedoRange:330,
      armor:.12, alive:true, shieldBoost:0, ai:'aggressive'
    },o);
  }
  function resetBattle(){
    ships.length=0;
    ships.push(
      mkShip({id:'p1',team:'player',name:"Sovereign's Fury",class:'CRUISER',x:.42,y:.78,angle:-Math.PI/2,r:27,hull:140,maxHull:140,shield:100,maxShield:100,energy:80,maxEnergy:80,crew:360,maxCrew:360,move:135}),
      mkShip({id:'p2',team:'player',name:'Avenger of Light',class:'FRIGATE',x:.69,y:.82,angle:-Math.PI/2,r:20,hull:90,maxHull:90,shield:60,maxShield:60,energy:65,maxEnergy:65,crew:190,maxCrew:190,move:165,broadsideRange:185,lanceRange:250,torpedoRange:320}),
      mkShip({id:'e1',team:'enemy',name:'Ashen Crown',class:'ENEMY CRUISER',x:.50,y:.23,angle:Math.PI/2,r:27,hull:125,maxHull:125,shield:85,maxShield:85,energy:70,maxEnergy:70,crew:330,maxCrew:330,move:125}),
      mkShip({id:'e2',team:'enemy',name:'Red Wake',class:'ENEMY DESTROYER',x:.78,y:.28,angle:Math.PI/2,r:22,hull:95,maxHull:95,shield:55,maxShield:55,energy:60,maxEnergy:60,crew:210,maxCrew:210,move:150,broadsideRange:190,lanceRange:245,torpedoRange:300})
    );
    // apply meta upgrades
    const p1=ships[0], p2=ships[1];
    [p1,p2].forEach(s=>{
      s.maxShield += state.upgrades.shield*15; s.shield=s.maxShield;
      s.maxEnergy += state.upgrades.reactor*12; s.energy=s.maxEnergy;
    });
    state.selected=p1; state.target=null; state.mode=null; state.pending=null; state.gameOver=false; state.phase='player';
    ui.confirmBar.classList.remove('show');
    updateUI();
    toast('Tap MOVE, then choose a destination.');
  }
  resetBattle();

  function px(s){return battlefield.x+s.x*battlefield.w}
  function py(s){return battlefield.y+s.y*battlefield.h}
  function toNorm(x,y){return {x:(x-battlefield.x)/battlefield.w,y:(y-battlefield.y)/battlefield.h}}
  function dist(a,b){const dx=px(a)-px(b),dy=py(a)-py(b);return Math.hypot(dx,dy)}
  function angleTo(a,b){return Math.atan2(py(b)-py(a),px(b)-px(a))}
  function normAngle(a){while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a}
  function arcDiff(a,b){return Math.abs(normAngle(a-b))}
  function facingLabel(a){
    const d=((a*180/Math.PI)%360+360)%360;
    if(d<22.5||d>=337.5)return 'E';
    if(d<67.5)return 'SE'; if(d<112.5)return 'S'; if(d<157.5)return 'SW';
    if(d<202.5)return 'W'; if(d<247.5)return 'NW'; if(d<292.5)return 'N'; return 'NE';
  }
  function alive(team){return ships.filter(s=>s.alive&&(!team||s.team===team))}
  function currentSelected(){return state.selected&&state.selected.alive?state.selected:alive('player')[0]}

  function background(){
    const g=ctx.createRadialGradient(W*.2,H*.28,20,W*.2,H*.28,Math.max(W,H)*.8);
    g.addColorStop(0,'#171022');g.addColorStop(.28,'#0c111a');g.addColorStop(1,'#030509');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // subtle nebula
    for(let i=0;i<4;i++){
      const x=W*(.15+i*.27), y=battlefield.y+battlefield.h*(.15+(i%2)*.45);
      const rg=ctx.createRadialGradient(x,y,0,x,y,Math.max(100,W*.38));
      rg.addColorStop(0,i%2?'rgba(31,77,107,.14)':'rgba(92,31,91,.12)');
      rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    }
    // stars
    const seed=1337;
    for(let i=0;i<115;i++){
      const x=(Math.sin(i*91.7+seed)*.5+.5)*W;
      const y=battlefield.y+(Math.sin(i*47.3+2.4)*.5+.5)*battlefield.h;
      const r=(i%17===0)?1.2:.55;
      ctx.fillStyle=i%11===0?'rgba(173,211,255,.65)':'rgba(255,255,255,.42)';
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    }
    // asteroids
    [[.12,.62,9],[.87,.55,7],[.21,.18,5],[.65,.47,4],[.92,.20,6]].forEach(a=>{
      const x=battlefield.x+a[0]*battlefield.w,y=battlefield.y+a[1]*battlefield.h,r=a[2];
      ctx.fillStyle='#1a1c20';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(140,147,158,.18)';ctx.stroke();
    })
  }

  function drawShip(s,ghost=false){
    if(!s.alive)return;
    const x=px(s),y=py(s),scale=Math.max(.72,Math.min(1.15,W/390));
    ctx.save();ctx.translate(x,y);ctx.rotate(s.angle);ctx.globalAlpha=ghost?.38:1;
    if(s===state.selected&&!ghost){
      ctx.shadowColor='#63baff';ctx.shadowBlur=18;
      ctx.strokeStyle='rgba(99,186,255,.9)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(0,0,s.r*1.05,s.r*1.35,0,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
    }
    // shield
    if(s.shield>0 && !ghost){
      const ratio=s.shield/s.maxShield;
      ctx.strokeStyle=s.team==='player'?`rgba(88,173,255,${.13+.23*ratio})`:`rgba(239,93,104,${.12+.18*ratio})`;
      ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,s.r*1.05,s.r*1.4,0,0,Math.PI*2);ctx.stroke();
    }
    // hull silhouette, true top-down
    const friendly=s.team==='player';
    ctx.fillStyle=friendly?'#d0c3a5':'#4d5158';
    ctx.strokeStyle=friendly?'#8b7444':'#8d333a';
    ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(s.r*1.22,0);
    ctx.lineTo(s.r*.55,-s.r*.42);
    ctx.lineTo(-s.r*.38,-s.r*.48);
    ctx.lineTo(-s.r*.94,-s.r*.26);
    ctx.lineTo(-s.r*1.1,0);
    ctx.lineTo(-s.r*.94,s.r*.26);
    ctx.lineTo(-s.r*.38,s.r*.48);
    ctx.lineTo(s.r*.55,s.r*.42);
    ctx.closePath();ctx.fill();ctx.stroke();
    // central spine
    ctx.fillStyle=friendly?'#8d7e60':'#2c3036';
    ctx.fillRect(-s.r*.6,-s.r*.1,s.r*1.45,s.r*.2);
    // broadside batteries
    ctx.fillStyle=friendly?'#b99650':'#7b3338';
    for(let i=-1;i<=1;i++){
      ctx.fillRect(-s.r*.25+i*s.r*.28,-s.r*.53,3,5);
      ctx.fillRect(-s.r*.25+i*s.r*.28,s.r*.48,3,5);
    }
    // prow & engines
    ctx.fillStyle=friendly?'#e6d8b9':'#7a7e86';ctx.beginPath();ctx.moveTo(s.r*1.25,0);ctx.lineTo(s.r*.83,-s.r*.18);ctx.lineTo(s.r*.83,s.r*.18);ctx.closePath();ctx.fill();
    ctx.fillStyle=friendly?'#64c6ff':'#ff6d66';ctx.fillRect(-s.r*1.06,-s.r*.12,4,s.r*.24);
    ctx.restore();

    if(!ghost){
      // status bars
      const bw=s.r*2.1,bx=x-bw/2,by=y+s.r*1.55;
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(bx,by,bw,5);
      ctx.fillStyle=s.team==='player'?'#65d58e':'#ef646b';ctx.fillRect(bx,by,bw*Math.max(0,s.hull/s.maxHull),2);
      ctx.fillStyle=s.team==='player'?'#55aef1':'#b25b70';ctx.fillRect(bx,by+3,bw*Math.max(0,s.shield/s.maxShield),2);
    }
  }

  function drawArcOverlay(){
    const s=state.selected;
    if(!s||!s.alive||state.phase!=='player')return;
    const x=px(s),y=py(s);
    if(['broadside','lance','torpedo'].includes(state.mode)){
      if(state.mode==='broadside'){
        drawFan(x,y,s.angle-Math.PI/2,Math.PI*.62,s.broadsideRange,'rgba(79,169,245,.13)','rgba(91,183,255,.5)');
        drawFan(x,y,s.angle+Math.PI/2,Math.PI*.62,s.broadsideRange,'rgba(79,169,245,.13)','rgba(91,183,255,.5)');
      }else{
        const range=state.mode==='lance'?s.lanceRange:s.torpedoRange;
        drawFan(x,y,s.angle,Math.PI*.58,range,state.mode==='lance'?'rgba(210,87,255,.12)':'rgba(255,151,67,.10)',state.mode==='lance'?'rgba(210,108,255,.5)':'rgba(255,157,76,.45)');
      }
    }
    if(state.mode==='move'||state.pending){
      const mr=s.move;
      ctx.strokeStyle='rgba(91,183,255,.5)';ctx.setLineDash([6,6]);ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,mr,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='rgba(91,183,255,.06)';ctx.beginPath();ctx.arc(x,y,mr,0,Math.PI*2);ctx.fill();
      if(state.pending){
        const p={x:state.pending.x,y:state.pending.y};
        const gx=battlefield.x+p.x*battlefield.w,gy=battlefield.y+p.y*battlefield.h;
        // path
        ctx.strokeStyle='rgba(137,213,255,.9)';ctx.lineWidth=2;ctx.setLineDash([7,5]);
        ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo((x+gx)/2,(y+gy)/2-24,gx,gy);ctx.stroke();ctx.setLineDash([]);
        // ghost ship
        const dummy=Object.assign({},s,{x:p.x,y:p.y,angle:state.pending.angle});
        drawShip(dummy,true);
        // facing arrow
        ctx.save();ctx.translate(gx,gy);ctx.rotate(state.pending.angle);
        ctx.strokeStyle='#76e59a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.r*.7,0);ctx.lineTo(s.r*1.7,0);ctx.stroke();
        ctx.fillStyle='#76e59a';ctx.beginPath();ctx.moveTo(s.r*1.95,0);ctx.lineTo(s.r*1.55,-6);ctx.lineTo(s.r*1.55,6);ctx.closePath();ctx.fill();ctx.restore();
      }
    }
  }
  function drawFan(x,y,a,width,range,fill,stroke){
    ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,range,a-width/2,a+width/2);ctx.closePath();ctx.fill();ctx.stroke();
  }

  function drawTargeting(){
    const t=state.target;if(!t||!t.alive)return;
    const x=px(t),y=py(t);
    ctx.strokeStyle='rgba(239,93,104,.9)';ctx.lineWidth=1.4;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.arc(x,y,t.r*1.55,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }

  function drawAnims(now){
    state.anims=state.anims.filter(a=>{
      const p=(now-a.t)/a.d;if(p>=1)return false;
      const x1=a.x1,y1=a.y1,x2=a.x2,y2=a.y2;
      if(a.kind==='lance'){
        ctx.strokeStyle=`rgba(214,109,255,${1-p})`;ctx.lineWidth=3.5;ctx.shadowColor='#d66dff';ctx.shadowBlur=12;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.shadowBlur=0;
      }else if(a.kind==='broadside'){
        ctx.strokeStyle=`rgba(255,161,75,${1-p})`;ctx.lineWidth=2;
        for(let i=0;i<5;i++){const off=(i-2)*5;ctx.beginPath();ctx.moveTo(x1,y1+off);ctx.lineTo(x1+(x2-x1)*Math.min(1,p*1.6),y1+off+(y2-y1)*Math.min(1,p*1.6));ctx.stroke();}
      }else if(a.kind==='torpedo'){
        const q=Math.min(1,p*1.15),x=x1+(x2-x1)*q,y=y1+(y2-y1)*q;
        ctx.strokeStyle='rgba(210,220,225,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x,y);ctx.stroke();
        ctx.fillStyle='#ffad5d';ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
      }
      return true;
    })
    state.particles=state.particles.filter(p=>{
      p.life-=.018;if(p.life<=0)return false;p.x+=p.vx;p.y+=p.vy;
      ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;return true;
    });
  }

  function render(now=performance.now()){
    background();
    drawArcOverlay();
    drawTargeting();
    ships.forEach(drawShip);
    drawAnims(now);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  function setMode(m){
    if(state.phase!=='player'||state.gameOver)return;
    state.mode = state.mode===m?null:m;
    state.pending=null; ui.confirmBar.classList.remove('show');
    document.querySelectorAll('.act').forEach(b=>b.classList.toggle('active',b.dataset.action===state.mode));
    if(m==='move')toast('Tap within the blue radius. Then tap around the ghost ship to set facing.');
    if(m==='rotate')toast('Tap anywhere around the selected ship to set its facing.');
    if(m==='broadside')toast('Tap an enemy inside either blue broadside arc.');
    if(m==='lance')toast('Tap an enemy inside the frontal lance arc.');
    if(m==='torpedo')toast('Tap an enemy inside the frontal torpedo arc.');
    if(m==='shield')doShield();
  }

  document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.action)));
  document.getElementById('endTurn').addEventListener('click',endPlayerTurn);
  ui.cancelMove.addEventListener('click',()=>{state.pending=null;state.mode=null;ui.confirmBar.classList.remove('show');syncActionHighlights();});
  ui.confirmMove.addEventListener('click',confirmPending);
  document.getElementById('help').addEventListener('click',showHelp);

  function syncActionHighlights(){document.querySelectorAll('.act').forEach(b=>b.classList.toggle('active',b.dataset.action===state.mode))}
  function toast(msg){
    ui.toast.textContent=msg;ui.toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>ui.toast.classList.remove('show'),2400);
  }

  function pointerPos(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left,y:t.clientY-r.top};
  }
  canvas.addEventListener('pointerdown',e=>handleTap(pointerPos(e)));

  function handleTap(p){
    if(state.gameOver||state.phase!=='player')return;
    if(p.y<battlefield.y||p.y>battlefield.y+battlefield.h)return;
    const s=state.selected;
    // if pending move: tap defines facing
    if(state.pending){
      const gx=battlefield.x+state.pending.x*battlefield.w,gy=battlefield.y+state.pending.y*battlefield.h;
      state.pending.angle=Math.atan2(p.y-gy,p.x-gx);
      ui.confirmBar.classList.add('show');
      updateUI();
      return;
    }
    // tap a friendly ship to select
    const hitFriend=alive('player').find(sh=>Math.hypot(p.x-px(sh),p.y-py(sh))<sh.r*1.55);
    if(hitFriend && !state.mode){
      state.selected=hitFriend;state.target=null;updateUI();return;
    }
    // movement placement
    if(state.mode==='move'&&s){
      const d=Math.hypot(p.x-px(s),p.y-py(s));
      if(d<=s.move && d>18){
        const n=toNorm(p.x,p.y);
        if(n.x>.03&&n.x<.97&&n.y>.04&&n.y<.96){
          state.pending={x:n.x,y:n.y,angle:s.angle,type:'move'};
          ui.confirmBar.classList.add('show');
          toast('Now tap around the ghost ship to choose its final facing.');
        }
      } else toast('Destination is outside movement range.');
      return;
    }
    if(state.mode==='rotate'&&s){
      state.pending={x:s.x,y:s.y,angle:Math.atan2(p.y-py(s),p.x-px(s)),type:'rotate'};
      ui.confirmBar.classList.add('show');return;
    }
    // combat target
    const enemy=alive('enemy').find(sh=>Math.hypot(p.x-px(sh),p.y-py(sh))<sh.r*1.8);
    if(enemy && ['broadside','lance','torpedo'].includes(state.mode)){
      state.target=enemy; tryAttack(state.mode,s,enemy);return;
    }
    if(enemy&&!state.mode){state.target=enemy;updateUI();}
  }

  function confirmPending(){
    const s=state.selected,p=state.pending;if(!s||!p)return;
    if(p.type==='move'){
      if(s.ap<1){toast('Not enough AP.');return}
      s.ap-=1;s.x=p.x;s.y=p.y;s.angle=p.angle;s.energy=Math.max(0,s.energy-4);
    }else{
      if(s.ap<1){toast('Not enough AP.');return}
      s.ap-=1;s.angle=p.angle;
    }
    state.pending=null;state.mode=null;ui.confirmBar.classList.remove('show');syncActionHighlights();updateUI();
  }

  function validArc(kind,s,t){
    const a=angleTo(s,t), d=dist(s,t);
    if(kind==='broadside'){
      const side1=arcDiff(a,s.angle+Math.PI/2)<Math.PI*.31;
      const side2=arcDiff(a,s.angle-Math.PI/2)<Math.PI*.31;
      return d<=s.broadsideRange&&(side1||side2);
    }
    if(kind==='lance')return d<=s.lanceRange&&arcDiff(a,s.angle)<Math.PI*.29;
    if(kind==='torpedo')return d<=s.torpedoRange&&arcDiff(a,s.angle)<Math.PI*.34;
    return false;
  }

  function tryAttack(kind,s,t){
    const cost=kind==='broadside'?2:2;
    const eCost=kind==='lance'?18:kind==='torpedo'?10:8;
    if(s.ap<cost){toast('Not enough AP.');return}
    if(s.energy<eCost){toast('Not enough energy.');return}
    if(!validArc(kind,s,t)){toast(kind==='broadside'?'Target is not inside a broadside arc.':'Target is outside the frontal firing arc.');return}
    s.ap-=cost;s.energy-=eCost;
    const bonus=state.upgrades.lance*(kind==='lance'?7:0);
    let dmg=kind==='lance'?38+bonus:kind==='torpedo'?45:34;
    if(kind==='broadside')dmg += Math.floor(Math.random()*11);
    if(kind==='torpedo'&&Math.random()<.18){toast('Point defence intercepted the torpedo.');animateAttack(kind,s,t);updateUI();return}
    applyDamage(t,dmg,kind);
    animateAttack(kind,s,t);
    state.mode=null;syncActionHighlights();updateUI();checkEnd();
  }

  function animateAttack(kind,s,t){
    state.anims.push({kind,x1:px(s),y1:py(s),x2:px(t),y2:py(t),t:performance.now(),d:kind==='torpedo'?900:520});
  }
  function applyDamage(t,dmg,kind){
    let shieldD=0,hullD=0;
    const shieldMul=kind==='lance'?1.35:1;
    if(t.shield>0){
      shieldD=Math.min(t.shield,Math.round(dmg*shieldMul));t.shield-=shieldD;dmg=Math.max(0,dmg-Math.round(shieldD/shieldMul));
    }
    if(dmg>0){hullD=Math.max(1,Math.round(dmg*(1-t.armor)));t.hull-=hullD}
    if(t.hull<=0){t.hull=0;t.alive=false;explode(t);}
    toast(`${kind.toUpperCase()}: ${shieldD?shieldD+' shield':''}${shieldD&&hullD?' + ':''}${hullD?hullD+' hull':''}${!shieldD&&!hullD?'no damage':''}`);
  }
  function explode(s){
    for(let i=0;i<26;i++){
      const a=Math.random()*Math.PI*2,sp=1+Math.random()*2.7;
      state.particles.push({x:px(s),y:py(s),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:1+Math.random()*3,life:.9+Math.random()*.4,color:Math.random()<.55?'#ff9b4e':'#d64f4f'});
    }
  }
  function doShield(){
    const s=state.selected;if(!s)return;
    if(s.ap<1||s.energy<10){toast('Need 1 AP and 10 Energy.');state.mode=null;syncActionHighlights();return}
    s.ap-=1;s.energy-=10;s.shield=Math.min(s.maxShield,s.shield+24);s.shieldBoost=1;
    state.mode=null;syncActionHighlights();updateUI();toast('Shield reinforced.');
  }

  function endPlayerTurn(){
    if(state.phase!=='player'||state.gameOver)return;
    state.mode=null;state.pending=null;ui.confirmBar.classList.remove('show');syncActionHighlights();
    state.phase='enemy';ui.phaseText.textContent='ENEMY PHASE';disableActions(true);
    setTimeout(enemyTurn,400);
  }
  async function enemyTurn(){
    for(const s of alive('enemy')){
      if(!alive('player').length)break;
      const targets=alive('player').slice().sort((a,b)=>dist(s,a)-dist(s,b));
      const t=targets[0];
      // turn towards broadside if close, frontal if far
      const a=angleTo(s,t),d=dist(s,t);
      if(d>s.lanceRange*.85){
        // move closer
        const step=Math.min(s.move*.75,d-180);
        const nx=px(s)+Math.cos(a)*step,ny=py(s)+Math.sin(a)*step;
        const n=toNorm(nx,ny);s.x=Math.max(.05,Math.min(.95,n.x));s.y=Math.max(.05,Math.min(.95,n.y));s.angle=a;s.ap-=1;
      }else{
        // prefer broadside orientation
        s.angle=a-Math.PI/2;
      }
      await wait(240);
      if(s.ap>=2){
        const kind=validArc('broadside',s,t)?'broadside':validArc('lance',s,t)?'lance':null;
        if(kind){
          s.ap-=2;s.energy-=kind==='lance'?18:8;
          applyDamage(t,kind==='lance'?34:30,kind);animateAttack(kind,s,t);
        }
      }
      await wait(420);
    }
    checkEnd();
    if(state.gameOver)return;
    state.turn++;ui.turnNo.textContent=state.turn;
    state.phase='player';ui.phaseText.textContent='PLAYER PHASE';
    alive().forEach(s=>{s.ap=s.maxAp;s.energy=Math.min(s.maxEnergy,s.energy+16);s.shield=Math.min(s.maxShield,s.shield+(s.shieldBoost?4:8));s.shieldBoost=0;});
    if(!state.selected?.alive)state.selected=alive('player')[0];
    disableActions(false);updateUI();toast('Your turn.');
  }
  function wait(ms){return new Promise(r=>setTimeout(r,ms))}
  function disableActions(v){document.querySelectorAll('.act').forEach(b=>b.disabled=v);document.getElementById('endTurn').disabled=v}

  function checkEnd(){
    if(!alive('enemy').length){state.gameOver=true;setTimeout(()=>showVictory(),500)}
    if(!alive('player').length){state.gameOver=true;setTimeout(()=>showDefeat(),500)}
  }

  function updateUI(){
    const s=currentSelected();if(!s)return;
    state.selected=s;
    ui.shipName.textContent=s.name;ui.shipClass.textContent=s.class;
    ui.hullTxt.textContent=`${Math.ceil(s.hull)}/${s.maxHull}`;
    ui.shieldTxt.textContent=`${Math.ceil(s.shield)}/${s.maxShield}`;
    ui.energyTxt.textContent=`${Math.ceil(s.energy)}/${s.maxEnergy}`;
    ui.apTxt.textContent=`${s.ap}/${s.maxAp}`;ui.crewTxt.textContent=`${s.crew}/${s.maxCrew}`;
    ui.facingTxt.textContent=facingLabel(s.angle);
    ui.hullBar.style.width=(100*s.hull/s.maxHull)+'%';ui.shieldBar.style.width=(100*s.shield/s.maxShield)+'%';ui.energyBar.style.width=(100*s.energy/s.maxEnergy)+'%';
    ui.statusPill.textContent=state.pending?'PLANNING':state.mode?state.mode.toUpperCase():'READY';
    if(ui.leftSide){
      ui.leftSide.innerHTML=`<h3>${s.name}</h3>
        <div class="row"><span>Class</span><b>${s.class}</b></div>
        <div class="row"><span>Hull</span><b>${Math.ceil(s.hull)}/${s.maxHull}</b></div>
        <div class="row"><span>Shield</span><b>${Math.ceil(s.shield)}/${s.maxShield}</b></div>
        <div class="row"><span>Energy</span><b>${Math.ceil(s.energy)}/${s.maxEnergy}</b></div>
        <div class="row"><span>AP</span><b>${s.ap}/${s.maxAp}</b></div>
        <div class="row"><span>Facing</span><b>${facingLabel(s.angle)}</b></div>`;
      const t=state.target;
      ui.rightSide.innerHTML=t?`<h3>${t.name}</h3>
        <div class="row"><span>Class</span><b>${t.class}</b></div>
        <div class="row"><span>Hull</span><b>${Math.ceil(t.hull)}/${t.maxHull}</b></div>
        <div class="row"><span>Shield</span><b>${Math.ceil(t.shield)}/${t.maxShield}</b></div>
        <div class="row"><span>Status</span><b>${t.hull<t.maxHull*.45?'DAMAGED':'ACTIVE'}</b></div>`:`<h3>Target</h3><div class="row"><span>Status</span><b>None</b></div>`;
    }
  }

  function showVictory(){
    state.rewards.credits=1000;state.rewards.salvage=220;
    ui.overlay.classList.add('show');
    ui.modal.innerHTML=`<h2>MISSION COMPLETE</h2>
      <p>The enemy formation has been broken. Salvage teams are recovering useful systems from the wreckage.</p>
      <div class="resultStats"><div><span>CREDITS</span><b>+1,000</b></div><div><span>SALVAGE</span><b>+220</b></div></div>
      <button class="primary" id="openUpgrades">OPEN SHIPYARD</button>`;
    document.getElementById('openUpgrades').onclick=showUpgrades;
  }
  function showDefeat(){
    ui.overlay.classList.add('show');
    ui.modal.innerHTML=`<h2>FLEET LOST</h2><p>Your formation collapsed. Try a different approach: use facing to line up broadsides and shield before exposing a damaged ship.</p>
      <button class="primary" id="retry">RETRY MISSION</button>`;
    document.getElementById('retry').onclick=()=>{ui.overlay.classList.remove('show');state.turn=1;ui.turnNo.textContent=1;resetBattle()};
  }
  function showUpgrades(){
    ui.modal.innerHTML=`<h2>SHIPYARD</h2>
      <p>Choose one persistent fleet upgrade. The prototype keeps this deliberately small to prove the combat → reward → upgrade loop.</p>
      <div class="upgrades">
        <div class="upgrade"><b>Lance Focusing Array</b><small>+7 lance damage per level. Creates a clearer long-range precision build.</small><button data-up="lance">INSTALL</button></div>
        <div class="upgrade"><b>Reinforced Void Shield</b><small>+15 maximum shields on each player ship per level.</small><button data-up="shield">INSTALL</button></div>
        <div class="upgrade"><b>Augmented Reactor</b><small>+12 maximum energy on each player ship per level.</small><button data-up="reactor">INSTALL</button></div>
      </div>
      <button class="primary" id="nextMission">REPLAY TEST BATTLE</button>`;
    ui.modal.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.up;state.upgrades[k]++;b.textContent='INSTALLED Lv.'+state.upgrades[k];b.disabled=true;
    });
    document.getElementById('nextMission').onclick=()=>{
      ui.overlay.classList.remove('show');state.turn=1;ui.turnNo.textContent=1;resetBattle();
    }
  }
  function showHelp(){
    ui.overlay.classList.add('show');
    ui.modal.innerHTML=`<h2>HOW TO PLAY</h2>
      <p><b>Mobile-first controls:</b> tap a friendly ship to select it. Tap MOVE, choose a point inside the blue movement circle, then tap around the ghost ship to set its final facing and confirm.</p>
      <p><b>Broadside</b> attacks only work from the left or right firing arcs. <b>Lance</b> and <b>Torpedo</b> attacks use the frontal arc. Facing therefore decides which weapons can fire.</p>
      <p>Each action costs AP; weapons also consume Energy. End the turn with the hourglass button. Ships regenerate some shield and energy between rounds.</p>
      <button class="primary" id="closeHelp">RETURN TO BATTLE</button>`;
    document.getElementById('closeHelp').onclick=()=>ui.overlay.classList.remove('show');
  }

  updateUI();
})();
</script>
</body>
</html>
